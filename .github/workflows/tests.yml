name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything that does not need AUTO-07p (tests marked `auto` skip themselves).
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python -m zipfile -e vendor/jaxkineticmodel.zip vendor
          pip install -e vendor/jaxkineticmodel --no-deps
          pip install --no-deps "crnt4sbml==0.0.15"
          pip install -e . --no-deps
      - name: Versions
        run: python -c "import sys, numpy, scipy, libsbml; print(sys.version); print(numpy.__version__, scipy.__version__, libsbml.__version__)"
      - name: Lint (syntax errors and undefined names only)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 dynalyst tests scripts
      - name: Tests without AUTO-07p
        run: python -m pytest -q -m "not auto" -p no:cacheprovider

  # Builds AUTO-07p from vendor/ and runs the AUTO tests that are quick.
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install gfortran and the core package
        run: |
          sudo apt-get update && sudo apt-get install -y gfortran
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m zipfile -e vendor/jaxkineticmodel.zip vendor
          pip install -e vendor/jaxkineticmodel --no-deps
          pip install -e . --no-deps
      - name: Build AUTO-07p (unpacks vendor/auto-07p.zip, then checks the cubic fold)
        run: python scripts/build_auto.py
      - name: AUTO tests
        run: python -m pytest -q tests/test_auto_pipeline.py tests/test_auto_capabilities.py tests/test_fold_refine.py -p no:cacheprovider

  # The core install alone (pip install -e .) must import and answer through the tools.
  core-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Core install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Import check
        run: python -c "import dynalyst, dynalyst.analysis.generic_sbml, dynalyst.analysis.bifurcation_auto; print('dynalyst', dynalyst.__version__)"
